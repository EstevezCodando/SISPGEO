worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    gzip          on;
    gzip_types    text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream backend {
        server coter_backend:8000;
    }

    upstream frontend {
        server coter_frontend:80;
    }

    # ── MODO ATUAL: HTTP simples ──────────────────────────────────────────────
    # server_name aponta para o domínio configurado.
    # Para ativar HTTPS, consulte o arquivo DEPLOY.md.
    server {
        listen 80;
        server_name sispgeo.dsg.eb.mil.br;   # ← substitua pelo seu domínio

        client_max_body_size 10M;

        location /api/ {
            proxy_pass         http://backend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90;
        }

        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_intercept_errors on;
            error_page 404 = /index.html;
        }
    }

    # ── MODO HTTPS (desativado) ───────────────────────────────────────────────
