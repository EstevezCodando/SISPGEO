server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # HTML nunca deve ser cacheado — assim o browser sempre busca o index.html
    # mais recente (que referencia os chunks com hash correto do Vite)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri /index.html;
    }

    # Ativos com hash (JS, CSS) podem ser cacheados por 1 ano
    location ~* \.(js|css|woff2?|ttf|otf|ico|png|jpg|jpeg|svg|gif|webp)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/font-woff2;
}
