[alembic]
script_location = alembic
# Formato de nome dos arquivos de migração gerados automaticamente
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# Garante que o package app/ está no path ao rodar alembic CLI
prepend_sys_path = .

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
