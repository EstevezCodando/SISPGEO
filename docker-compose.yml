services:
  db:
    image: postgis/postgis:16-3.4
    container_name: sispgeo_db
    environment:
      POSTGRES_DB: sispgeo
      POSTGRES_USER: sispgeo_user
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD obrigatório — defina no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
    networks:
      - sispgeo_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sispgeo_user -d sispgeo"]
      interval: 10s
      timeout: 5s
      retries: 5
    # Sem porta exposta — acesso apenas via rede interna sispgeo_net

  backend:
    build: ./backend
    container_name: sispgeo_backend
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: sispgeo_user
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD obrigatorio - execute: python step0.py}"
      DB_NAME: sispgeo
      SECRET_KEY: "${SECRET_KEY:?SECRET_KEY obrigatorio - execute: python step0.py}"
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?ADMIN_PASSWORD obrigatorio - execute: python step0.py}"
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      SMTP_HOST: ${SMTP_HOST:-smtp.webmail.eb.mil.br}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM: ${SMTP_FROM:-sispgeo@sispgeo.br}
      SMTP_TLS: ${SMTP_TLS:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-noreply@sispgeo.br}
      MAILPIT_HOST: ${MAILPIT_HOST:-mailpit}
      MAILPIT_PORT: ${MAILPIT_PORT:-1025}
      BDGEX_API_URL: ${BDGEX_API_URL:-http://bdgex.eb.mil.br/api}
      BDGEX_MOCK: ${BDGEX_MOCK:-false}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      ENV: ${ENV:-development}
      DADOS_PATH: /app/dados
    depends_on:
      db:
        condition: service_healthy
    networks:
      - sispgeo_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./backend/app:/app/app
      - ./dados:/app/dados
    # Sem porta exposta — acesso apenas via nginx

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: /api/v1
    container_name: sispgeo_frontend
    networks:
      - sispgeo_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  # ── Mailpit — captura de e-mails em desenvolvimento ───────────────────────────
  # Em PRODUÇÃO: remova este serviço — os e-mails são enviados pelo Zimbra/SMTP.
  mailpit:
    image: axllent/mailpit:v1.20
    container_name: sispgeo_mailpit
    environment:
      MP_UI_AUTH: "${MAILPIT_USER:-admin}:${MAILPIT_PASS:-sispgeo_mail_dev}"
      MP_DATABASE: /data/mailpit.db
      MP_MAX_MESSAGES: "500"
    ports:
      # UI web: exposta APENAS no loopback — inacessível da rede externa
      - "127.0.0.1:8025:8025"
    volumes:
      - mailpit_data:/data
    networks:
      - sispgeo_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  nginx:
    build: ./nginx
    container_name: sispgeo_nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
      - backend
    networks:
      - sispgeo_net
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  mailpit_data:

networks:
  sispgeo_net:
    driver: bridge
    # Rede interna isolada — apenas os containers declarados têm acesso
    internal: false # false = nginx pode receber conexões externas
